[project]
name = "pose-graph-bracketing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ogamache", email = "o.gamache2@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "gtsam>=4.2.2",
    "kornia>=0.8.3",
    "numpy>=1.26.4",
    "opencv-python-headless>=4.11.0.86",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "torch>=2.13.0",
]

[project.scripts]
pose-graph-bracketing = "pose_graph_bracketing:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "scipy>=1.17.1",
]
