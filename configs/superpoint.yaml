mode: stereo                  # stereo | mono -- selects the VO frontend/backend used
frontend: superpoint_lightglue # disk_lightglue | superpoint_lightglue -- see superpoint_frontend.py, config.SuperPointConfig below

dataset:
  bayer_pattern: RGGB          # RGGB, BGGR, GRBG, GBRG, or none
  side: left

preprocessing:
  crop_bottom_px: 175
  clahe_enabled: false
  clahe_clip_limit: 10.0
  clahe_tile_grid_size: 8
  gaussian_blur_enabled: false
  gaussian_blur_ksize: 5
  gaussian_blur_sigma: 0.0

tracking:
  max_corners: 1000
  grid_rows: 2
  grid_cols: 2
  hysteresis_margin: 0.15
  hysteresis_radius: 5.0

disk:
  device: cuda                 # falls back to cpu automatically if unavailable
  checkpoint: depth
  window_size: 5
  score_threshold: 0.0
  match_max_distance: 0.5
  kp_oversample_factor: 3

superpoint:
  # used only when frontend: superpoint_lightglue -- see superpoint_frontend.py
  device: cuda
  max_keypoints: 1000

lightglue:
  device: cuda
  feature_name: superpoint
  min_confidence: 0.9

# Stereo/mono landmark-based bundle adjustment: triangulate matches into metric
# 3D points, track them as persistent landmarks across frames, and tie each
# sighting to its landmark via a reprojection factor (robust/Huber-weighted;
# GenericStereoFactor3D when mode=stereo, GenericProjectionFactorCal3_S2 when
# mode=mono). Shared by both modes -- pixel_sigma/huber_k/landmark_prior_sigma
# are camera-agnostic reprojection-noise/robust-kernel/prior quantities;
# min_disparity_px/max_depth_m are stereo-triangulation-specific and unused
# in mono mode (mono uses its own two-view triangulation validity gate instead,
# reusing max_depth_m as its landmarkDistanceThreshold).
stereo:
  min_disparity_px: 1.0        # px, reject near-infinite/degenerate depth (stereo only)
  max_depth_m: 60.0            # reject unreliably-far triangulated points
  pixel_sigma: 1.0             # px, rectified-pixel reprojection noise
  huber_k: 1.345                # standard Huber constant (~95% efficiency under Gaussian noise)
  landmark_prior_sigma: 3.0    # m, weak prior anchoring each new landmark near its initial triangulation
                                # (prevents rare numerical divergence -> Huber weight underflow -> indeterminate system)
  assumed_speed_mps: 2.5        # mono only: assumed constant speed for landmark-seeding baseline scale (see StereoConfig)
  # false (default): flat pixel_sigma for every stereo observation. true:
  # scales pixel_sigma up linearly with the observation's own disparity-
  # implied depth past depth_scaled_noise_reference_m -- down-weights far
  # observations in the bundle adjustment. Diagnostic ablation, see
  # docs/cycle_bias_findings.md and factors.make_stereo_observation_factor.
  depth_scaled_noise: false
  depth_scaled_noise_reference_m: 5.0   # m, below this depth pixel_sigma is unscaled

motion_prior:
  # prediction residual: Logmap((X_i * Expmap(V_i*dt)).between(X_j))
  rotation_sigma: 0.05          # rad, per motion-prior step (scaled by sqrt(dt) internally)
  translation_sigma: 0.05       # m, per motion-prior step (scaled by sqrt(dt) internally)
  # velocity random-walk residual: V_j - V_i
  angular_velocity_rw_sigma: 0.5   # rad/s per sqrt(s)
  linear_velocity_rw_sigma: 1.0    # m/s per sqrt(s)
  # gauge-fixing prior on the very first node's velocity
  initial_velocity_prior_sigma: 1.0
  initial_pose_prior_sigma: 1.0e-3
  # false (default): every frame's pose prediction assumes continued
  # constant-velocity motion. true: every frame's prediction is Identity
  # (assume no motion happened) -- see config.MotionPriorConfig's
  # docstring.
  zero_motion: false
  # Only used when zero_motion: true -- deliberately loose, flat (not
  # dt-scaled) sigmas, since rotation_sigma/translation_sigma above are
  # calibrated for the constant-velocity prediction and would be a very
  # confident, wrong prior if reused for zero-motion. See
  # factors.motion_prior_noise_model's docstring.
  zero_motion_rotation_sigma: 3.14159    # rad, flat
  zero_motion_translation_sigma: 10.0    # m, flat

graph:
  vo_lookback: 4
  # gtsam_unstable.IncrementalFixedLagSmoother window (seconds): variables not
  # re-touched within this long get properly marginalized. Must comfortably
  # exceed vo_lookback frames' worth of elapsed time even for the slowest-fps
  # dataset (10fps datasets: ~0.1s/frame * 4 = 0.4s -- 1.0s gives good margin).
  smoother_lag_s: 1.0

# Live diagnostic view (see scripts/run_trajectory.py --visualize): a cv2
# window showing, per frame, which keypoints/matches got used vs discarded,
# plus a second cv2 window with a live bird's-eye + height trajectory plot.
visualization:
  enabled: false
  step: false   # --step: wait for a keypress before each next frame instead of free-running
  low_info_threshold: 20   # n_landmark_observations below this -> frame flagged LOW-INFO
  start_frame: 0   # skip ahead: the SLAM pipeline starts at this frame index (earlier frames are dropped, not just hidden)
